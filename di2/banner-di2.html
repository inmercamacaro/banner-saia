<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Derecho Internacional II</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .di2-banner {
    position: relative;
    width: 100%;
    max-width: 508px;
    aspect-ratio: 16 / 9;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 15px;
    background: #0b090a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .di2-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.15s linear;
  }
  .di2-slide.active { opacity: 1; }
  .di2-slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .di2-slide.active img {
    animation: di2-zoom 1.1s linear forwards;
  }
  @keyframes di2-zoom {
    from { transform: scale(1.08); }
    to { transform: scale(1.18); }
  }
  .di2-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 55%);
    pointer-events: none;
  }
  .di2-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: #7a1f2e;
    z-index: 3;
  }
  .di2-label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0 16px 18px;
    color: #f5f2ea;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 4px;
    text-align: center;
    text-shadow: 0 4px 18px rgba(0,0,0,0.9);
    opacity: 0;
    z-index: 2;
  }
  .di2-slide.active .di2-label {
    animation: di2-labelfade 1s linear forwards;
  }
  @keyframes di2-labelfade {
    0% { opacity: 0; transform: translateY(10px); }
    15% { opacity: 1; transform: translateY(0); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .di2-title {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #0b090a;
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: 5;
    text-align: center;
    padding: 0 20px;
  }
  .di2-title.show { opacity: 1; }
  .di2-title h1 {
    color: #f5f2ea;
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 3px;
    line-height: 1.15;
  }
  .di2-title .di2-rule {
    width: 0;
    height: 5px;
    background: #7a1f2e;
    margin-top: 18px;
    transition: width 0.8s ease 0.2s;
  }
  .di2-title.show .di2-rule { width: 200px; }
  .di2-title .di2-sub {
    color: #8f8a80;
    font-size: 13px;
    letter-spacing: 5px;
    margin-top: 14px;
    opacity: 0;
    transition: opacity 0.8s ease 0.6s;
  }
  .di2-title.show .di2-sub { opacity: 1; }
</style>
</head>
<body>
<div class="di2-banner" id="di2banner">
  <div class="di2-bar"></div>
  <!-- slides se generan por JS -->
  <div class="di2-title" id="di2title">
    <h1>DERECHO<br>INTERNACIONAL&nbsp;II</h1>
    <div class="di2-rule"></div>
    <div class="di2-sub">UNIVERSIDAD FERMÍN TORO · SAIA</div>
  </div>
</div>
<script>
(function(){
  var slides = [
    {img: 'img/real_ww1.jpg', text: '1914 · LA GRAN GUERRA'},
    {img: 'img/real_ww2.jpg', text: '1939 · LA SEGUNDA GUERRA'},
    {img: 'img/real_carta_onu.jpg', text: '1945 · LA CARTA'},
    {img: 'img/real_onu_asamblea.jpg', text: 'LAS NACIONES UNIDAS'},
    {img: 'img/real_onu_sede.jpg', text: 'EL ESCENARIO MUNDIAL'},
    {img: 'img/real_haya.jpg', text: 'LA HAYA'},
    {img: 'img/real_corte_cij.jpg', text: 'LA CORTE INTERNACIONAL'},
    {img: 'img/real_iran.jpg', text: 'IRÁN'},
    {img: 'img/real_venezuela.jpg', text: 'VENEZUELA'}
  ];
  var banner = document.getElementById('di2banner');
  var title = document.getElementById('di2title');
  // precargar
  slides.forEach(function(s){ var im = new Image(); im.src = s.img; });
  // construir slides
  var els = slides.map(function(s){
    var d = document.createElement('div');
    d.className = 'di2-slide';
    d.innerHTML = '<img src="' + s.img + '" alt="">' +
      '<div class="di2-shade"></div>' +
      '<div class="di2-label">' + s.text + '</div>';
    banner.insertBefore(d, title);
    return d;
  });
  var i = 0;
  function next(){
    if (i > 0) els[i-1].classList.remove('active');
    if (i < els.length) {
      els[i].classList.add('active');
      i++;
      setTimeout(next, 1000);
    } else {
      title.classList.add('show');
    }
  }
  next();
})();
</script>
</body>
</html>
